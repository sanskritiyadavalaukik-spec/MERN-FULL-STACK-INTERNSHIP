<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-card">
  
    <section id="view-login" class="view" data-title="Log in" aria-labelledby="login-heading">
      <h1 >Login</h1>     

      <form data-form="login" novalidate>        

          <div class="field">
            <label for="login-email">Email</label>
            <input class="form-input" id="login-email" name="email" type="email" required
                   autocomplete="email" aria-describedby="login-email-error" aria-invalid="false">
            <p id="login-email-error" class="error" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input class="form-input" id="login-password" name="password" type="password" required
                   autocomplete="current-password" aria-describedby="login-password-error" aria-invalid="false">
            <p id="login-password-error" class="error" aria-live="polite"></p>
          </div>
        <label>

            <input class="remember-box" type="checkbox">
            Remember me
        </label>

        <button type="submit" class="btn">Sign in</button>
        <p class="success" role="status" hidden></p>
      </form>

      <p class="switch-page">Don't have an account? <a href="registration.html" >Register</a></p>

    </section>

  </main>
   
</body>
</html>
