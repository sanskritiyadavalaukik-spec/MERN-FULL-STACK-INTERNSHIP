<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> My Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="dashboard-container">

        <aside class="sidebar">
            <h2>My Dashboard</h2>

            <nav>
                <a href="#" class="active">Dashboard</a>
                <a href="#">Tasks</a>
            </nav>

            <a href="loginpage.html" class="logout">Logout</a>
        </aside>

        <main class="main-content">

            <section class="welcome">
                <p>Here's an overview of your tasks.</p>
            </section>

            <section class="stats">
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <p>12</p>
                </div>

                <div class="stat-card">
                    <h3>Completed Tasks</h3>
                    <p>8</p>
                </div>

                <div class="stat-card">
                    <h3>Pending Tasks</h3>
                    <p>4</p>
                </div>

                <div class="stat-card">
                    <h3>Progress</h3>
                    <p>67%</p>
                </div>
            </section>
        </main>
    </div>
    
</body>
</html>
